name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      # La fonction serveur générée doit correspondre au code du jeu (physique, circuits).
      - run: npm run build:function
      - run: git diff --exit-code supabase/functions/submit-score/index.ts
