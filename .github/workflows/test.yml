name: tests
on: [push, pull_request]

jobs:
  # Qualité du code, tests unitaires (noyau sans DOM), fichiers générés à jour.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run lint
      - run: npm test
      # La fonction serveur générée doit correspondre au code du jeu (physique, circuits) : sinon la vérification des temps rejouerait une autre physique.
      - run: npm run build:function
      - run: git diff --exit-code supabase/functions/submit-score/index.ts
      # sw.js (cache hors ligne) et le préchargement des modules de index.html (déjà contrôlés par npm test, répétés ici pour un message clair)
      - run: npm run sw
      - run: git diff --exit-code sw.js index.html

  # La fonction serveur tourne sous Deno : la physique doit y donner EXACTEMENT les mêmes nombres que sous Node (js/dmath.js explique pourquoi).
  # L'empreinte de tools/phys-fingerprint.json a été calculée sous Node ; Deno doit la retrouver bit à bit.
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: 2.9.6 }
      - run: deno run -A tools/test-dmath.mjs
      - run: deno run -A tools/phys-fingerprint.mjs

  # Le jeu dans un vrai navigateur (Chromium sans écran) : écrans, course, éditeur, garage, profil, et la même empreinte de physique que Node et Deno.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # Les scripts SQL de supabase/ (communauté, classements, comptes, durcissement) sur un vrai PostgreSQL, appliqués deux fois (relançables).
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: npm run test:sql
